name: XAVRX build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run portable core tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude source/core.c source/config.c source/log.c tests/test_core.c -o /tmp/xavrx-core-tests
          /tmp/xavrx-core-tests
      - name: Run read-only FIRM container tests
        run: python3 -m unittest discover -s tests -p 'test_firm_inspect.py' -v

  build-3ds-homebrew:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
      options: --user 1001
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify preinstalled 3DS toolchain
        shell: bash
        run: |
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -f "$DEVKITARM/3ds_rules"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
      - name: Build diagnostic application
        shell: bash
        run: make
      - name: Build Xavrx Installer
        shell: bash
        run: make -C apps/xavrx-installer
      - name: Create SD-card layout package
        shell: bash
        run: |
          bash scripts/package-sd.sh
          test -s build/xavrx-sd-layout.zip
      - name: Upload SD-card layout package
        uses: actions/upload-artifact@v4
        with:
          name: xavrx-sd-layout
          path: build/xavrx-sd-layout.zip
          if-no-files-found: error
      - name: Report artifact sizes
        shell: bash
        run: |
          test -s xavrx-diagnostic.3dsx
          test -s apps/xavrx-installer/xavrx-installer.3dsx
          stat -c '%n %s bytes' xavrx-diagnostic.3dsx apps/xavrx-installer/xavrx-installer.3dsx
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: xavrx-diagnostic-3dsx
          path: xavrx-diagnostic.3dsx
          if-no-files-found: error
      - name: Upload Xavrx Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xavrx-installer-3dsx
          path: apps/xavrx-installer/xavrx-installer.3dsx
          if-no-files-found: error
