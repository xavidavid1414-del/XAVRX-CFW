name: XAVRX build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run portable core tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude source/core.c source/config.c source/log.c tests/test_core.c -o /tmp/xavrx-core-tests
          /tmp/xavrx-core-tests

  build-3ds-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install devkitPro and 3DS toolchain
        shell: bash
        run: |
          curl -fL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36" https://apt.devkitpro.org/install-devkitpro-pacman -o /tmp/install-devkitpro-pacman
          test "$(wc -c < /tmp/install-devkitpro-pacman)" -gt 500
          chmod +x /tmp/install-devkitpro-pacman
          sudo /tmp/install-devkitpro-pacman
          sudo /opt/devkitpro/pacman/bin/pacman -Syu --noconfirm
          sudo /opt/devkitpro/pacman/bin/pacman -S --noconfirm 3ds-dev
      - name: Build diagnostic application
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM="$DEVKITPRO/devkitARM"
          make
      - name: Build Xavrx Installer
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM="$DEVKITPRO/devkitARM"
          make -C apps/xavrx-installer
      - name: Create SD-card layout package
        shell: bash
        run: |
          bash scripts/package-sd.sh
          test -s build/xavrx-sd-layout.zip
      - name: Upload SD-card layout package
        uses: actions/upload-artifact@v4
        with:
          name: xavrx-sd-layout
          path: build/xavrx-sd-layout.zip
          if-no-files-found: error
      - name: Report artifact sizes
        shell: bash
        run: |
          test -s xavrx-diagnostic.3dsx
          test -s apps/xavrx-installer/xavrx-installer.3dsx
          stat -c '%n %s bytes' xavrx-diagnostic.3dsx apps/xavrx-installer/xavrx-installer.3dsx
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: xavrx-diagnostic-3dsx
          path: xavrx-diagnostic.3dsx
          if-no-files-found: error
      - name: Upload Xavrx Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xavrx-installer-3dsx
          path: apps/xavrx-installer/xavrx-installer.3dsx
          if-no-files-found: error
