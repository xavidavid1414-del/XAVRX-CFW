name: XAVRX build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run portable core tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude source/core.c source/config.c source/log.c tests/test_core.c -o /tmp/xavrx-core-tests
          /tmp/xavrx-core-tests

  build-3ds-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install devkitPro and 3DS toolchain
        shell: bash
        run: |
          curl -L https://github.com/devkitPro/installer/releases/latest/download/devkitpro-pacman.deb -o /tmp/devkitpro-pacman.deb
          sudo dpkg -i /tmp/devkitpro-pacman.deb
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm 3ds-dev
      - name: Build diagnostic application
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM="$DEVKITPRO/devkitARM"
          make
      - name: Report artifact size
        shell: bash
        run: |
          test -s xavrx-diagnostic.3dsx
          stat -c '%n %s bytes' xavrx-diagnostic.3dsx
      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: xavrx-diagnostic-3dsx
          path: xavrx-diagnostic.3dsx
          if-no-files-found: error
